<mat-toolbar class="mat-elevation-z1" color="primary">
  <div class="fill-remaining-space" >
  <a class="logo" href="">
    MindCodia
  </a>
    <app-language-switcher></app-language-switcher>
  </div>
  <button mat-button class="hide-on-mobile" *ngIf="isLoggedIn && !isSignInPage" (click)="this.router.navigate(['package'])">
    <fa-icon [icon]="faStickyNote"></fa-icon>
    Package Purchase
  </button>
  <button mat-button class="hide-on-mobile" (click)="this.router.navigate(['services'])">
    Services
  </button>
  <button mat-button class="hide-on-mobile" (click)="this.router.navigate(['articles'])">
    Blog
  </button>
  <button mat-button *ngIf="!isLoggedIn && !isSignInPage" (click)="this.router.navigate(['sign-in'])">
    <fa-icon [icon]="faUser"></fa-icon>
    Log In
  </button>

  <mat-menu #adminMenu="matMenu" xPosition="before">
    <ng-template matMenuContent>
      <button mat-menu-item *ngIf="isAdmin && isLoggedIn && !isSignInPage" (click)="this.router.navigate(['create-quiz'])">
        <fa-icon [icon]="faPlus"></fa-icon>
        Create question
      </button>
      <button mat-menu-item *ngIf="isAdmin && isLoggedIn && !isSignInPage" (click)="this.router.navigate(['create-quiz'])">
        <fa-icon [icon]="faPlus"></fa-icon>
        Create article
      </button>
      <button mat-menu-item *ngIf="isAdmin && isLoggedIn && !isSignInPage" (click)="this.router.navigate(['create-quiz'])">
        <fa-icon [icon]="faPlus"></fa-icon>
        Create category
      </button>
      <button mat-menu-item *ngIf="isAdmin && isLoggedIn && !isSignInPage" (click)="this.router.navigate(['users'])">
        <fa-icon [icon]="faPlus"></fa-icon>
        User Management
      </button>
      <button mat-menu-item *ngIf="isAdmin && isLoggedIn && !isSignInPage" (click)="this.router.navigate(['tag-create'])">
        <fa-icon [icon]="faPlus"></fa-icon>
        Questions Management
      </button>
    </ng-template>
  </mat-menu>
  <button mat-button *ngIf="isAdmin && isLoggedIn && !isSignInPage" [matMenuTriggerFor]="adminMenu">
    <fa-icon [icon]="faUserNinja"></fa-icon>
    <span class="hide-on-mobile">Administrator Menu</span>
  </button>
  <mat-menu #mobileMenu="matMenu" xPosition="before">
    <ng-template matMenuContent>
      <button mat-menu-item *ngIf="isLoggedIn && !isSignInPage" (click)="this.router.navigate(['package'])">
        <fa-icon [icon]="faStickyNote"></fa-icon>
        Package Purchase
      </button>
      <button mat-menu-item (click)="this.router.navigate(['services'])">
        Services
      </button>
      <button mat-menu-item (click)="this.router.navigate(['articles'])">
        <fa-icon [icon]="faNewspaper"></fa-icon>
        Blog
      </button>
    </ng-template>
  </mat-menu>
  <button mat-button class="hide-on-desktop" *ngIf="isLoggedIn && !isSignInPage" [matMenuTriggerFor]="mobileMenu">
    <svg viewBox="0 0 100 80" width="40" height="40">
      <rect width="100" height="20" rx="10"></rect>
      <rect y="30" width="100" height="20" rx="10"></rect>
      <rect y="60" width="100" height="20" rx="10"></rect>
    </svg>
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before">
    <ng-template matMenuContent>
      <button mat-menu-item (click)="this.router.navigate(['account'])">
        <fa-icon [icon]="faUser"></fa-icon>
        My profile
      </button>
      <button mat-menu-item (click)="notComletedTest()">
        <fa-icon [icon]="faFileClipboard"></fa-icon>
        My test in progress
      </button>
      <button mat-menu-item (click)="onSignOut()">
        <fa-icon [icon]="faRightFromBracket"></fa-icon>
        Log Out
      </button>
    </ng-template>
  </mat-menu>
  <button mat-button *ngIf="isLoggedIn" [matMenuTriggerFor]="userMenu">
    <div matButtonIcon class="profile-image-wrapper">
<!--      getImage() ? getImage() :-->
      <img
      class="rounded-circle"
      src="{{
                  '/assets/avatars/avatar_00.jpg'
                }}"
      alt="{{ getUsername() }}"
    />
    </div>
  {{ getUsername()}}
  </button>
</mat-toolbar>
