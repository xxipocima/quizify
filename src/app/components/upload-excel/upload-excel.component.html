<app-navbar></app-navbar>

<div class="container">
    <div class="spinner" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>

  <mat-card *ngIf="!isLoading">
    <mat-card-title style="margin-bottom: 20px">Upload excel</mat-card-title>
    <mat-card-content>
<form [formGroup]="form" (ngSubmit)="submit()">
  <input formControlName="file" type="file"/>

  <div class="submit-wrapper">
  <button mat-flat-button class="button-start" type="submit">
    <i-bs width="25" height="25" name="check2-circle"></i-bs>
    Upload
  </button>
  </div>
</form>
    </mat-card-content>
  </mat-card>

</div>
<app-footer></app-footer>
