<app-navbar></app-navbar>

<div class="container-category">
  <div class="spinner" *ngIf="!category && !noCategory">
    <mat-spinner></mat-spinner>
  </div>
  <div class="category-container">
    <ng-container *ngIf="category && categoryFound; else noCategory">

      <div class="iconFrame">
        <div class="iconWrapper">
          <img src="assets/01.webp">
        </div>
      </div>

      <h2>{{ category.id + '.name' | translate}}</h2>

<!--      <h5>Questions: {{category.quizzes ? category.quizzes.length : 0}}</h5>-->
      <ng-container *ngIf="quizzesFound && isAdmin; else noQuizzes">
        <div class="row quiz-row">
          <div class="col-md-6" *ngFor="let quiz of quizzes">
            <div *ngIf="quiz">
              <mat-card class="quiz-card" *ngIf="quiz.quizID">
                <mat-card-header>
                  <mat-card-title class="quiz-title">{{ getLimitedText(quiz.name, 25) }}</mat-card-title>

                </mat-card-header>
                <mat-card-content>
                  <p class="quiz-description">{{ getLimitedText(quiz.description, 250) }}</p>
<!--                  <button mat-flat-button color="primary" (click)="goToQuiz(quiz.quizID)">Take the quiz</button>-->
                  <button mat-flat-button color="primary"  (click)="editQuiz(quiz)" type="button" matTooltip="Edit the quiz">
                    <i-bs width="20" height="20" name="pencil-square"></i-bs> Edit
                  </button>
                  <button  (click)="deleteQuiz(quiz)" mat-flat-button color="warn" type="button" matTooltip="Remove the quiz">
                    <i-bs width="20" height="20" name="trash"></i-bs> Remove
                  </button>

<!--                  <button mat-stroked-button (click)="shareQuiz(quiz.quizID)" >-->
<!--                    <i class="bi bi-share"></i>-->
<!--                    Share quiz-->
<!--                  </button>-->

<!--                  <div class="madeBy">-->
<!--                  Made by: <a  href="javascript:void(0)" (click)="router.navigate(['user', quiz.authorName])">{{ quiz.authorName }}</a>-->
<!--                  </div>-->

                </mat-card-content>

              </mat-card>
            </div>
          </div>
        </div>

        <ngb-pagination [collectionSize]="quizzesIDs.length" [(page)]="currentPage" [pageSize]="pageSize" (pageChange)="pageChange($event)"></ngb-pagination>
      </ng-container>

      <ng-template #noQuizzes>
                <p>{{ category.id + '.description' | translate}}</p>
        <button mat-flat-button class="button-start" (click)="this.router.navigate(['test/' + category.id])">
        <i-bs width="25" height="25" name="check2-circle"></i-bs>
          {{ 'START' | translate}}
      </button>
<!--        <p>No quizzes found in this category.</p>-->
      </ng-template>
    </ng-container>

    <ng-template #noCategory>
      <div class="iconFrame">
        <div class="iconWrapper">
          <i-bs width="50" height="50" name="question"></i-bs>
        </div>
      </div>
      <p>No such category found.</p>
    </ng-template>
  </div>
</div>
<app-footer></app-footer>
