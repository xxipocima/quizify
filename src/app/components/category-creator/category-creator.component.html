<app-navbar></app-navbar>

<div class="container">
    <div class="spinner" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>

  <mat-card *ngIf="isEditCategoryNotFound">
    <a class="logo-wrapper" href="/">
      <img class="logo"  height="70"  src="/assets/home-page-154.png" alt="Mindcodia" />
    </a>

    <mat-card-title>{{"Questions not found"}}</mat-card-title>

    <mat-card-content  style="text-align: center">

      <div>
        <p>The questions you're looking for doesn't exist.</p>
      </div>
      <button mat-flat-button class="submit-btn" (click)="this.router.navigate(['/'])" color="primary">Back to Home</button>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="!isLoading && !categoryId && !isEditCategoryNotFound">
    <mat-card-title *ngIf="!editCategoryId" style="margin-bottom: 20px">Create category!</mat-card-title>
    <mat-card-title *ngIf="editCategoryId" style="margin-bottom: 20px">Edit category!</mat-card-title>
    <mat-card-content>
<form [formGroup]="categoryForm" (ngSubmit)="submitCategory()">
  <mat-form-field appearance="outline" class="quiz-form__field">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" required>
  </mat-form-field>
  <mat-form-field appearance="outline" class="quiz-form__field">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description"></textarea>
  </mat-form-field>
  <mat-form-field appearance="outline" class="quiz-form__field">
    <mat-label>Image</mat-label>
    <textarea matInput formControlName="icon"></textarea>
  </mat-form-field>

  <div class="submit-wrapper">
  <button mat-flat-button class="button-start" type="submit">
    <i-bs width="25" height="25" name="check2-circle"></i-bs>
    Submit
  </button>
  </div>
</form>
    </mat-card-content>
  </mat-card>

  <app-create-success [quizId]="categoryId" [editQuizId]="editCategoryId" *ngIf="categoryId">
  </app-create-success>


</div>
<app-footer></app-footer>
